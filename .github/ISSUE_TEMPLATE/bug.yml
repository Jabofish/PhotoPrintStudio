name: 问题反馈
description: 报告可以复现的功能问题
body:
  - type: markdown
    attributes:
      value: 请先检查提交内容，移除真实证件照、原图、用户名、本地路径及设备信息。可以使用软件自带样片复现。
  - type: input
    id: environment
    attributes:
      label: 软件版本和 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤、预期结果和实际结果
    validations:
      required: true
